aid: sofy
name: SOFY
description: >-
  SOFY is an AI-powered software testing platform that autonomously writes,
  executes, and maintains no-code tests across mobile, web, API, and enterprise
  applications. Testers describe intent in natural language and SOFY's AI agents
  generate and self-heal the automation as the app changes, running against
  2,000+ real devices in the cloud plus web and ERP surfaces (SAP, Dynamics 365).
  SOFY exposes a public REST API at https://public.sofy.ai for CI/CD automation
  (GitHub Actions, GitLab, Jenkins, Azure DevOps): upload application builds,
  trigger scheduled test runs, poll status, and abort runs, with outbound
  webhooks on run completion. SOFY is a portfolio company of 500 Global.
